name: Bulk DNC Scrub

on:
  # schedule:
  #   - cron: '0 10 * * *' # 10:00 UTC daily — TEMPORARILY DISABLED, re-enable when ready
  workflow_dispatch:
    inputs:
      test_contact_id:
        description: 'HubSpot contact ID to scrub in isolation (leave blank for normal bulk run)'
        required: false
        type: string
      list_id:
        description: 'HubSpot active list ID to scrub (leave blank for normal bulk run)'
        required: false
        type: string
      sample_limit:
        description: 'Cap the number of candidates processed (e.g. 5 for a sample check)'
        required: false
        type: string
      dry_run:
        description: 'Print detailed per-contact results without writing anything to HubSpot'
        required: false
        type: boolean
        default: false
      force_reprocess:
        description: 'Re-check every list member even if already scrubbed today (use after a logic change)'
        required: false
        type: boolean
        default: false
      ebr_override_leadsource:
        description: 'TEST ONLY: skip the install-completed gate for LastEBRDate when leadsource exactly matches this value (leave blank for normal behavior)'
        required: false
        type: string
      only_dnc_true:
        description: 'List mode only: restrict processing to contacts currently marked dnc_opt_out=Yes'
        required: false
        type: boolean
        default: false
      raw_check_leadsource:
        description: 'TEST ONLY: for this exact leadsource, send QuickCheck bare PhoneNumber only (no dates/consent logic) and set dnc_opt_out purely from Status/litigator (leave blank for normal behavior)'
        required: false
        type: string

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run bulk scrub
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          DNC_OAUTH_CLIENT_ID: ${{ secrets.DNC_OAUTH_CLIENT_ID }}
          DNC_OAUTH_CLIENT_SECRET: ${{ secrets.DNC_OAUTH_CLIENT_SECRET }}
          DNC_OAUTH_SCOPE: ${{ secrets.DNC_OAUTH_SCOPE }}
          TEST_CONTACT_ID: ${{ github.event.inputs.test_contact_id }}
          HUBSPOT_LIST_ID: ${{ github.event.inputs.list_id }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
          EBR_OVERRIDE_LEADSOURCE: ${{ github.event.inputs.ebr_override_leadsource }}
          ONLY_DNC_TRUE: ${{ github.event.inputs.only_dnc_true }}
          RAW_CHECK_LEADSOURCE: ${{ github.event.inputs.raw_check_leadsource }}
        run: node bulk_dnc_scrub.js
